<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>psa2z.com · Under construction</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2716%27 fill=%27%231f2a37%27/%3E%3Crect x=%2712%27 y=%2716%27 width=%2718%27 height=%2714%27 rx=%274%27 fill=%27%23ff9f1a%27/%3E%3Crect x=%2734%27 y=%2716%27 width=%2718%27 height=%2714%27 rx=%274%27 fill=%27%23fff%27/%3E%3Crect x=%2712%27 y=%2734%27 width=%2718%27 height=%2714%27 rx=%274%27 fill=%27%23fff%27/%3E%3Crect x=%2734%27 y=%2734%27 width=%2718%27 height=%2714%27 rx=%274%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16191f;--dim:#5b6472;--line:#e3e6ea;--acc:#ff9f1a;}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#171c23;--ink:#e8ecf2;--dim:#a3adbb;--line:#2a313c;}}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
main{width:min(520px,100%);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:40px 36px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.06);}
.logo{width:56px;height:56px;margin:0 auto 22px;display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:9px;border-radius:15px;background:#1f2a37;}
.logo i{border-radius:4px;background:#fff;}
.logo i:first-child{background:var(--acc);animation:pulse 2.4s ease-in-out infinite;}
@keyframes pulse{50%{opacity:.45;}}
@media (prefers-reduced-motion:reduce){.logo i:first-child{animation:none;}}
h1{margin:0 0 10px;font-size:26px;letter-spacing:-.02em;}
p{margin:0;color:var(--dim);font-size:15px;line-height:1.55;}
.bar{height:6px;margin:26px auto 10px;width:70%;border-radius:999px;background:var(--line);overflow:hidden;}
.bar span{display:block;height:100%;width:62%;border-radius:inherit;background:var(--acc);}
small{display:block;margin-top:24px;color:var(--dim);font-size:12px;}
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <h1>Under construction</h1>
  <p>psa2z.com is being built. Check back soon.</p>
  <div class="bar" role="progressbar" aria-label="Progress" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100"><span></span></div>
  <small>© psa2z.com</small>
</main>
</body>
</html>
